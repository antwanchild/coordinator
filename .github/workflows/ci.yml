name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python Dev Environment
        uses: ./.github/actions/setup-python-dev
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify application imports
        run: python -c "import app"

      - name: Run Black
        run: black --check --diff .

      - name: Run Pyright
        run: pyright --project pyproject.toml

      - name: Install Playwright Chromium
        if: matrix.python-version == '3.12'
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          RUN_BROWSER_TESTS: ${{ matrix.python-version == '3.12' && '1' || '0' }}
        run: python -m unittest discover -s tests -t .

  docker-security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: coordinator:pr-scan
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            APP_COMMIT_SHA=${{ github.event.pull_request.head.sha }}

      - name: Export container root filesystem
        run: |
          container_id=$(docker create coordinator:pr-scan)
          mkdir -p rootfs
          docker export "$container_id" | tar -x -C rootfs
          docker rm "$container_id"

      - name: Diagnose embedded Python package metadata
        run: |
          echo "Runtime package versions:"
          docker run --rm --entrypoint python coordinator:pr-scan -c 'import importlib.metadata as m; print("msgpack", m.version("msgpack")); print("setuptools", m.version("setuptools")); print("urllib3", m.version("urllib3"))'

          echo
          echo "Files containing stale package/version references:"
          grep -RIlE 'msgpack[^0-9]{0,40}1\.1\.2|setuptools[^0-9]{0,40}70\.3\.0|urllib3[^0-9]{0,40}2\.7\.0' rootfs 2>/dev/null | sort | tee stale-metadata-files.txt || true

          echo
          echo "Likely SBOM/package metadata files:"
          find rootfs -type f \( -iname '*sbom*' -o -iname '*.spdx*' -o -iname '*.cdx*' -o -iname '*cyclonedx*' -o -iname '*syft*' \) -print | sort || true

          echo
          echo "Matching stale references with context (first 200 lines):"
          grep -RInE 'msgpack[^0-9]{0,40}1\.1\.2|setuptools[^0-9]{0,40}70\.3\.0|urllib3[^0-9]{0,40}2\.7\.0' rootfs 2>/dev/null | head -200 || true

      - name: Scan container root filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: rootfs
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
