name: Release Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-release:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the validated commit is still main
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Main has moved since this run was validated. Publish from the newer CI run instead." >&2
            exit 1
          fi

      - name: Bump version from commit range
        id: bump
        run: |
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file not found" >&2
            exit 1
          fi

          CURRENT=$(tr -d '[:space:]' < VERSION)

          if ! echo "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION file contains invalid version: $CURRENT" >&2
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              RANGE="HEAD^..HEAD"
            else
              RANGE="HEAD"
            fi
          else
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            PARENT_SHA=$(git rev-list --parents -n 1 "$HEAD_SHA" | awk '{print $2}')
            if [ -n "$PARENT_SHA" ]; then
              RANGE="$PARENT_SHA..$HEAD_SHA"
            else
              RANGE="$HEAD_SHA"
            fi
          fi

          FOUND_MAJOR=false
          FOUND_MINOR=false
          FOUND_PATCH=false

          while IFS= read -r COMMIT_MSG; do
            [ -z "$COMMIT_MSG" ] && continue
            NORMALIZED=$(printf '%s' "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')

            if echo "$NORMALIZED" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
              FOUND_MAJOR=true
              break
            elif echo "$NORMALIZED" | grep -qE '^feat(\([^)]+\))?:'; then
              FOUND_MINOR=true
            elif echo "$NORMALIZED" | grep -qE '^fix(\([^)]+\))?:'; then
              FOUND_PATCH=true
            fi
          done < <(git log --format=%s "$RANGE")

          if [ "$FOUND_MAJOR" = true ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            BUMPED=true
          elif [ "$FOUND_MINOR" = true ]; then
            MINOR=$((MINOR + 1)); PATCH=0
            BUMPED=true
          elif [ "$FOUND_PATCH" = true ]; then
            PATCH=$((PATCH + 1))
            BUMPED=true
          else
            BUMPED=false
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          {
            echo "version=$NEW_VERSION"
            echo "bumped=$BUMPED"
          } >> "$GITHUB_OUTPUT"
          echo "Range: $RANGE"
          echo "Version: $CURRENT -> $NEW_VERSION (bumped: $BUMPED)"

      - name: Generate CHANGELOG with git-cliff
        if: steps.bump.outputs.bumped == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.bump.outputs.version }} --prepend CHANGELOG.md

      - name: Commit VERSION and CHANGELOG
        if: steps.bump.outputs.bumped == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$NEW_VERSION" > VERSION
          git add VERSION CHANGELOG.md
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || {
            echo "ERROR: Failed to commit VERSION and CHANGELOG" >&2
            exit 1
          }
          git tag "v$NEW_VERSION" || {
            echo "ERROR: Failed to create tag v$NEW_VERSION — tag may already exist" >&2
            exit 1
          }
          git push origin main --follow-tags || {
            echo "ERROR: Failed to push — branch may be out of sync" >&2
            exit 1
          }
          git push origin "v$NEW_VERSION" || {
            echo "ERROR: Failed to push tag v$NEW_VERSION" >&2
            exit 1
          }

      - name: Record release commit
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: prepare-release
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      base_version: ${{ steps.build.outputs.base_version }}
      build_number: ${{ steps.build.outputs.build_number }}
      app_version: ${{ steps.build.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Record image source
        id: source
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read base version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Compute build suffix
        id: build
        run: |
          BASE_VERSION="${{ steps.version.outputs.value }}"

          if ! echo "$BASE_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION file contains invalid version: $BASE_VERSION" >&2
            exit 1
          fi

          VERSION_BUMP_COMMIT=$(git log -1 --format=%H -- VERSION)
          if [ -z "$VERSION_BUMP_COMMIT" ]; then
            echo "ERROR: Unable to determine the latest VERSION bump commit" >&2
            exit 1
          fi

          BUILD_NUMBER=$(git rev-list --count --first-parent "${VERSION_BUMP_COMMIT}..HEAD")

          APP_VERSION="${BASE_VERSION}-build${BUILD_NUMBER}"
          {
            echo "base_version=$BASE_VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Base version: $BASE_VERSION"
          echo "Version bump commit: $VERSION_BUMP_COMMIT"
          echo "Build number: $BUILD_NUMBER"
          echo "App version: $APP_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.build.outputs.app_version }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.source.outputs.short }}
          labels: |
            org.opencontainers.image.title=V-Coordinator Schedule Builder
            org.opencontainers.image.description=Browser-based schedule builder with Excel export
            org.opencontainers.image.vendor=antwanchild

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.build.outputs.app_version }}
            org.opencontainers.image.base.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ needs.prepare-release.outputs.release_sha }}
          build-args: |
            APP_VERSION=${{ steps.build.outputs.app_version }}
            APP_COMMIT_SHA=${{ needs.prepare-release.outputs.release_sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.app_version }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-files: '**/pip/_vendor/bom.cdx.json'

      - name: Publish scanned image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  notify-release:
    if: always() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - publish-image
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Send Discord result
        uses: ./.github/actions/discord-result
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}
          project: Coordinator
          event: Release
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || (needs.publish-image.result == 'success' && 'success') || 'skipped' }}
          sha: ${{ needs.prepare-release.outputs.release_sha || github.event.workflow_run.head_sha || github.sha }}
          version: ${{ needs.publish-image.outputs.app_version }}
